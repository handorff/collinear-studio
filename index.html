<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Collinear Studio is an independent studio for prints, tools, and experiments. Explore Now Arriving, Pasta Standards Manual, and Paul Handorff’s personal site.">
  <title>Collinear Studio</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css">
  <script src="./assets/field.js" defer></script>
</head>
<body>
  <main class="plot" aria-label="Collinear Studio projects">
    <canvas aria-hidden="true"></canvas>
    <h1 class="studio-title">Collinear Studio</h1>
    <a class="project-point" href="https://nowarriving.store"
      aria-label="Now Arriving"
      data-summary="Transit maps and route diagrams drawn with a pen plotter. The linework traces the routes that connect the places we pass through every day."
      data-link-label="Visit Now Arriving"></a>
    <a class="project-point" href="https://github.com/handorff/pasta-engineers"
      aria-label="Pasta Standards Manual"
      data-summary="An illustrated reference to pasta shapes, drawn with a pen plotter. Each technical plate treats a familiar shape as an engineering drawing, complete with dimensions and cross-sections."
      data-link-label="View the project on GitHub"></a>
    <a class="project-point" href="https://paulhandorff.com/"
      aria-label="Paul Handorff"
      data-summary="Paul Handorff’s personal site, with a brief bio and a collection of projects including transit maps, a word game, and a tiling tool."
      data-link-label="Visit paulhandorff.com"></a>

    <section id="project-details" class="project-tooltip" aria-labelledby="project-title"
      aria-describedby="project-summary" tabindex="-1" hidden>
      <div class="tooltip-content">
        <h2 id="project-title"></h2>
        <p id="project-summary"></p>
        <a class="project-link" href="./"><span></span><span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>
</body>
</html>
